    <!-- Photo Viewer Overlay -->
    <div class="photo-viewer" id="photoViewer">
        <button class="photo-viewer-close" aria-label="Close viewer">&times;</button>
        <button class="photo-viewer-arrow prev" aria-label="Previous photo">
            <svg viewBox="0 0 24 24">
                <polyline points="15 18 9 12 15 6"></polyline>
            </svg>
        </button>
        <div class="photo-viewer-content">
            <img src="" alt="Expanded photo">
        </div>
        <button class="photo-viewer-arrow next" aria-label="Next photo">
            <svg viewBox="0 0 24 24">
                <polyline points="9 6 15 12 9 18"></polyline>
            </svg>
        </button>
        <div class="photo-viewer-counter"></div>
    </div>
