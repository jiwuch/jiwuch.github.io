<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>J W</title>
    <link rel="icon" type="image/png" href="icon/icon.png">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <!-- Navigation -->
    <nav class="nav">
        <a href="index.html" class="nav-logo">J W</a>
        <ul class="nav-links">
            <li><a href="index.html">Home</a></li>
            <li><a href="collections.html">Collections</a></li>
            <li><a href="about.html">About</a></li>
        </ul>
    </nav>

    <!-- Gallery -->
    <main class="gallery">
        <div class="slideshow">
            <div class="slide active">
                <img src="photos-collections/ocean/P1010236.JPG" alt="Ocean photograph 1">
            </div>
            <div class="slide">
                <img src="photos-collections/ocean/P1010223.JPG" alt="Ocean photograph 2">
            </div>
            <div class="slide">
                <img src="photos-collections/ocean/P1010221.JPG" alt="Ocean photograph 3">
            </div>
            <div class="slide">
                <img src="photos-collections/ocean/P1010230.JPG" alt="Ocean photograph 4">
            </div>
            <div class="slide">
                <img src="photos-collections/ocean/P1010231.JPG" alt="Ocean photograph 5">
            </div>
            <div class="slide">
                <img src="photos-collections/ocean/P1010213.JPG" alt="Ocean photograph 6">
            </div>
            <div class="slide">
                <img src="photos-collections/ocean/P1010240.JPG" alt="Ocean photograph 7">
            </div>
            <div class="slide">
                <img src="photos-collections/ocean/P1010241.JPG" alt="Ocean photograph 8">
            </div>
        </div>

        <!-- Click areas for navigation -->
        <div class="click-area prev" aria-label="Previous photo"></div>
        <div class="click-area next" aria-label="Next photo"></div>

        <!-- Navigation arrows -->
        <button class="nav-arrow prev" aria-label="Previous photo">
            <svg viewBox="0 0 24 24">
                <polyline points="15 18 9 12 15 6"></polyline>
            </svg>
        </button>
        <button class="nav-arrow next" aria-label="Next photo">
            <svg viewBox="0 0 24 24">
                <polyline points="9 6 15 12 9 18"></polyline>
            </svg>
        </button>
    </main>

    <!-- Photo counter -->
    <div class="photo-counter">01 / 11</div>

    <script src="js/main.js"></script>
</body>
</html>
